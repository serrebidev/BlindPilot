[mypy]
python_version = 3.12
# Pinned, and not optional. mypy resolves os, ctypes, winreg and winsound
# against the target platform's stdlib, and this code carries both halves
# behind runtime `platform.system()` checks that no checker can read.
# Unpinned, the same tree reports 21 errors on Windows and 52 on Linux.
platform = win32
files = blindpilot_app.py, agent_backends.py, app_updater.py, claude_reader.py,
        markdown_rows.py, session_history.py, diagnostics.py, update_dialog.py,
        linux_accessibility.py, chat_integration.py,
        hermes_backend.py, hermes_worker.py
# wxPython, winpty, pexpect and accessible_output2 ship no stubs.
ignore_missing_imports = True

# accessible_ai is adapted from a sibling project. Calls into it are still
# checked, because its types are followed; its own errors are not ours to fix.
[mypy-accessible_ai.*]
follow_imports = silent
