[pytest]
pythonpath = .
# Only the suite. A bare `pytest` used to walk everything under the tree,
# including untracked scratch folders under docs/, and could die collecting
# them before a single test ran.
testpaths = tests
# A test that hangs must fail rather than run out the clock. This suite drives
# real subprocesses, pseudo-terminals and worker threads, and CI has no job
# timeout of its own beyond GitHub's six-hour default - so one stuck wait used
# to mean a six-hour build. The slowest test here takes about three seconds.
timeout = 60
# seleniumbase (installed globally for another app) and pytest-playwright both
# register --browser; with both loaded, every run dies at startup.
addopts = -p no:cacheprovider -p no:seleniumbase
