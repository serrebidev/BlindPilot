[pytest]
pythonpath = .
# A test that hangs must fail rather than run out the clock. This suite drives
# real subprocesses, pseudo-terminals and worker threads, and CI has no job
# timeout of its own beyond GitHub's six-hour default - so one stuck wait used
# to mean a six-hour build. The slowest test here takes about three seconds.
timeout = 60
addopts = -p no:cacheprovider
