name: Dependency Review

# Pull requests only. It diffs the dependency changes against the GitHub
# Advisory Database and fails when the PR introduces a known-vulnerable
# dependency, before the change reaches a release tag.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    # GitHub code-scanning/dependency APIs; Forgejo answers 404.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
